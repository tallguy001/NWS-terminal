# Deploys the site to Cloudflare Pages whenever main changes.
# The repository root is the site (the same files as a release zip). README.md and .github/ are left out of what is deployed.
#
# One-time setup, in this repository under Settings > Secrets and variables > Actions:
#   Secret    CLOUDFLARE_API_TOKEN    a Cloudflare API token with Account > Cloudflare Pages > Edit
#   Secret    CLOUDFLARE_ACCOUNT_ID   the Cloudflare account ID
#   Variable  CF_PAGES_PROJECT        the name of the existing Pages project (the part before .pages.dev)
# The app's own keys (GS_TOKEN, WI511_KEY and the rest) stay in Cloudflare and are not needed here.
name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the one-time setup
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: |
          missing=""
          [ -n "$TOKEN" ]   || missing="$missing secret CLOUDFLARE_API_TOKEN;"
          [ -n "$ACCOUNT" ] || missing="$missing secret CLOUDFLARE_ACCOUNT_ID;"
          [ -n "$PROJECT" ] || missing="$missing variable CF_PAGES_PROJECT;"
          if [ -n "$missing" ]; then
            echo "::error::Not deployed. Missing in Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Stage the site
        run: |
          mkdir dist
          git archive HEAD | tar -x -C dist
          rm -rf dist/.github dist/README.md
          test -f dist/index.html && test -f dist/_worker.js && test -f dist/app.js && test -f dist/sw.js

      - name: Check the scripts parse and the version marks agree
        run: |
          node --check dist/app.js
          node --check dist/_worker.js
          node --check dist/sw.js
          app=$(grep -o "var APP_VERSION = '[0-9.]*'" dist/app.js | grep -o "[0-9][0-9.]*")
          worker=$(grep -o "const VERSION = '[0-9.]*'" dist/_worker.js | grep -o "[0-9][0-9.]*")
          page=$(grep -o "app.js?v=[0-9.]*" dist/index.html | grep -o "[0-9][0-9.]*$")
          echo "app $app, worker $worker, page $page"
          if [ -z "$app" ] || [ "$app" != "$worker" ] || [ "$app" != "$page" ]; then
            echo "::error::Version marks disagree (app $app, worker $worker, page $page)."
            exit 1
          fi
          echo "VERSION=$app" >> "$GITHUB_ENV"

      - name: Refuse anything that looks like an API key
        run: |
          # every key belongs in Cloudflare as a secret; this repository is public
          if grep -rEIl "(lapi|tapi)_[A-Za-z0-9]{8,}|sk-ant-[A-Za-z0-9_-]{8,}|\b[0-9a-f]{32}\b" dist; then
            echo "::error::A file above holds something shaped like an API key. Not deployed."
            exit 1
          fi

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-dirty=true --no-bundle

      - name: Summary
        run: echo "Deployed NWS Terminal v$VERSION to the Pages project ${{ vars.CF_PAGES_PROJECT }}." >> "$GITHUB_STEP_SUMMARY"
